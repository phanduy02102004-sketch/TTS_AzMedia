services:
  app:
    user: www-data
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      SESSION_SECURE_COOKIE: "false"
    volumes:
      - .:/var/www/html
      - app_vendor:/var/www/html/vendor
      - app_bootstrap_cache:/var/www/html/bootstrap/cache

  nginx:
    volumes:
      - ./public:/var/www/html/public:ro

  db:
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-3307}:3306"

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: "0"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PMA_HOST_PORT:-8081}:80"

volumes:
  app_vendor:
  app_bootstrap_cache:
